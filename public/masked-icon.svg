<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid background for maskable icon safe zone -->
  <rect width="512" height="512" fill="#0f172a" />
  
  <!-- Glowing background elements -->
  <circle cx="256" cy="256" r="160" fill="#a855f7" opacity="0.15" filter="blur(40px)" />
  <circle cx="256" cy="256" r="100" fill="#3b82f6" opacity="0.2" filter="blur(20px)" />

  <!-- Center Graphic: Trading Trend Arrow & Candlesticks (within 60% safe zone) -->
  <g transform="translate(128, 128) scale(0.5)">
    <!-- Bullish Candlestick 1 -->
    <rect x="100" y="240" width="30" height="120" rx="4" fill="#10b981" />
    <line x1="115" y1="180" x2="115" y2="390" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

    <!-- Bullish Candlestick 2 -->
    <rect x="200" y="160" width="30" height="140" rx="4" fill="#10b981" />
    <line x1="215" y1="100" x2="215" y2="340" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

    <!-- Bullish Candlestick 3 -->
    <rect x="300" y="80" width="30" height="130" rx="4" fill="#10b981" />
    <line x1="315" y1="30" x2="315" y2="260" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

    <!-- Trend Line / Arrow -->
    <path d="M 60 380 L 150 280 L 250 180 L 370 70" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 370 70 L 310 70 M 370 70 L 370 130" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
